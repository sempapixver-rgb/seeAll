name: Build seeAll Agent APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-agent/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-agent
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: seeall-agent-apk
          path: android-agent/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Get version
        id: ver
        run: echo "tag=agent-$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: seeAll Agent (test)
          body: |
            App de teste para descobrir e adicionar câmeras.
            - Descoberta ONVIF na LAN
            - Adicionar câmera por RTSP
            - Visualização ao vivo (H.264)
            Baixe o APK e instale via Downloader/sideload.
          files: android-agent/app/build/outputs/apk/debug/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
